<!-- NAVBAR -->
<header class="bg-slate-900 border-b border-slate-800 h-16 flex items-center justify-between px-4 md:px-6 shadow-md text-white sticky top-0 z-30">
  
  <!-- Left Side: Brand Logo & Title -->
  <div class="flex items-center space-x-3">
    <!-- Mobile Menu Toggle Button (Hanya muncul di Layar HP) -->
    <button id="btn-toggle-sidebar" onclick="toggleMobileSidebar()" class="md:hidden p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none">
      <i class="fa-solid fa-bars text-lg"></i>
    </button>
    
    <!-- App Logo & Name -->
    <div class="flex items-center space-x-2.5">
      <div class="bg-indigo-600 text-white p-2 rounded-xl font-bold shadow-md shadow-indigo-500/20 flex items-center justify-center w-8 h-8">
        <i class="fa-solid fa-cash-register text-sm"></i>
      </div>
      <div>
        <h1 id="page-title" class="font-bold text-base md:text-lg tracking-wide leading-tight">KasirApp Pro</h1>
        <p class="text-[10px] text-slate-400 hidden sm:block">Manajemen Toko & Kasir</p>
      </div>
    </div>
  </div>

  <!-- Right Side: Search / Actions / User Info -->
  <div class="flex items-center space-x-3">
    
    <!-- Status Badge Online -->
    <span class="hidden sm:flex items-center gap-1.5 px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full text-xs font-medium">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> LocalStorage Mode
    </span>

    <!-- Divider -->
    <div class="h-6 w-[1px] bg-slate-800 hidden sm:block"></div>

    <!-- User Profile Dropdown / Card -->
    <div class="flex items-center space-x-2 bg-slate-800/80 hover:bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700/50 cursor-pointer transition">
      <div class="w-7 h-7 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shadow-inner">
        A
      </div>
      <div class="text-left hidden md:block">
        <p class="text-xs font-semibold text-slate-200 leading-none">Admin Toko</p>
        <p class="text-[10px] text-slate-400 leading-none mt-1">Petugas Kasir</p>
      </div>
    </div>

  </div>

</header>
